{% extends 'base.html' %}
{% block title %}Welcome · Steam Store{% endblock %}
{% block content %}
<div class="page-intro auth-intro"><p class="eyebrow">WELCOME</p><h1>Welcome to Steam Store</h1><p class="muted">Sign in to browse games, or create an account if this is your first visit.</p></div>
<section class="auth-grid">
  <div class="panel"><h2>Sign in</h2>
    <form method="post" action="{{ url_for('login') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" required maxlength="100" autocomplete="username"></label>
      <label>Password<input type="password" name="password" required maxlength="128" autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <div class="panel"><h2>Create account</h2>
    <form method="post" action="{{ url_for('register') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" required maxlength="100" autocomplete="username"></label>
      <label>Email<input type="email" name="email" required maxlength="254" autocomplete="email"></label>
      <label>Password<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
      <button type="submit">Create account</button>
    </form>
  </div>
</section>
{% endblock %}
